<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    padding:16px;

    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 50% 8%,
            #fff2a3 0%,
            #e5ae18 18%,
            #765000 45%,
            #120b00 100%
        );

    overflow-x:hidden;
}

/* GOLD GLOW */

body::before{
    content:"";

    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    background:rgba(255,210,50,.22);

    filter:blur(90px);

    top:-180px;
    left:50%;

    transform:translateX(-50%);

    pointer-events:none;
}


/* CARD */

.card{
    width:100%;
    max-width:430px;

    text-align:center;

    padding:25px 12px;

    position:relative;
    z-index:2;
}


/* DP */

.dp{
    display:block;

    width:118px;
    height:118px;

    margin:0 auto 18px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #ffe05a;

    box-shadow:
        0 0 15px #ffd43b,
        0 0 40px rgba(255,193,7,.75);
}


/* TITLE */

h1{
    font-size:clamp(24px,7vw,30px);

    line-height:1.2;

    font-weight:900;

    color:#fff8d0;

    margin-bottom:9px;

    text-shadow:
        0 2px 12px rgba(0,0,0,.7);
}


/* DESCRIPTION */

.desc{
    max-width:350px;

    margin:0 auto 23px;

    color:#ffefad;

    font-size:14px;

    line-height:1.55;
}


/* RED BUTTON */

.join{
    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    width:100%;

    min-height:58px;

    padding:16px 20px;

    border-radius:14px;

    border:2px solid #ff8585;

    background:
        linear-gradient(
            135deg,
            #ff5b5b 0%,
            #e60000 45%,
            #a80000 100%
        );

    color:#fff;

    text-decoration:none;

    font-size:18px;

    font-weight:900;

    letter-spacing:.4px;

    box-shadow:
        0 5px 0 #650000,
        0 10px 30px rgba(255,0,0,.45);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


/* RED GLOW */

.join::after{
    content:"";

    position:absolute;

    inset:0;

    border-radius:14px;

    box-shadow:
        0 0 25px rgba(255,0,0,.55);

    opacity:.7;

    animation:pulse 1.8s infinite;

    pointer-events:none;
}

@keyframes pulse{

    0%,100%{
        opacity:.35;
    }

    50%{
        opacity:.85;
    }
}


/* SHINE */

.join::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:55%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.75),
            transparent
        );

    transform:skewX(-25deg);

    animation:shine 2.7s infinite;
}

@keyframes shine{

    0%{
        left:-120%;
    }

    45%,100%{
        left:150%;
    }
}


/* HOVER */

.join:hover{
    transform:translateY(-3px);

    box-shadow:
        0 8px 0 #650000,
        0 15px 40px rgba(255,0,0,.7);
}


/* CLICK */

.join:active{
    transform:translateY(2px);

    box-shadow:
        0 3px 0 #650000,
        0 7px 18px rgba(255,0,0,.45);
}


/* INFO */

.info{
    margin-top:20px;

    padding:14px 10px;

    border-radius:13px;

    border:1px solid rgba(255,225,100,.45);

    background:rgba(15,9,0,.60);

    backdrop-filter:blur(8px);

    color:#ffefb0;

    font-size:13px;

    line-height:1.9;
}


/* FOOTER */

.footer{
    margin-top:20px;

    color:#d4b55b;

    font-size:11px;

    line-height:1.6;
}

.telegram{
    font-size:22px;
}


/* SMALL PHONES */

@media(max-width:360px){

    body{
        padding:10px;
    }

    .card{
        padding:20px 8px;
    }

    .dp{
        width:95px;
        height:95px;
        margin-bottom:15px;
    }

    h1{
        font-size:23px;
    }

    .desc{
        font-size:13px;
        margin-bottom:20px;
    }

    .join{
        min-height:54px;
        padding:14px;
        font-size:16px;
    }

    .info{
        font-size:12px;
    }
}
