<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(
            circle at 50% 10%,
            #fff3a6 0%,
            #e8b51f 20%,
            #8b5d00 48%,
            #1a1000 100%
        );
    overflow:hidden;
}

/* Background glow */
body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(255,215,50,.20);
    filter:blur(100px);
    top:-200px;
    left:50%;
    transform:translateX(-50%);
}

/* Main card */
.card{
    width:100%;
    max-width:430px;
    text-align:center;
    padding:35px 18px;
    position:relative;
    z-index:2;
}

/* DP */
.dp{
    width:125px;
    height:125px;
    border-radius:50%;
    object-fit:cover;

    border:4px solid #ffe05a;

    box-shadow:
        0 0 15px #ffd43b,
        0 0 45px rgba(255,193,7,.75);

    margin-bottom:20px;
}

/* Title */
h1{
    font-size:30px;
    font-weight:900;
    color:#fff8d0;
    margin-bottom:10px;

    text-shadow:
        0 2px 12px rgba(0,0,0,.7);
}

/* Description */
.desc{
    color:#ffefad;
    font-size:15px;
    line-height:1.6;
    margin-bottom:26px;
}

/* Telegram Button */
.join{
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    width:100%;
    padding:18px;

    border-radius:15px;
    border:2px solid #ffed8a;

    background:
        linear-gradient(
            135deg,
            #fff4a6 0%,
            #ffd83d 25%,
            #f2aa00 55%,
            #ffe875 100%
        );

    color:#392400;
    text-decoration:none;

    font-size:19px;
    font-weight:900;
    letter-spacing:.5px;

    box-shadow:
        0 5px 0 #805300,
        0 12px 35px rgba(255,193,7,.5);

    transition:all .25s ease;
}

/* Moving shine */
.join::before{
    content:"";
    position:absolute;

    top:0;
    left:-120%;

    width:60%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.85),
            transparent
        );

    transform:skewX(-25deg);

    animation:shine 2.5s infinite;
}

@keyframes shine{

    0%{
        left:-120%;
    }

    45%,100%{
        left:150%;
    }
}

/* Hover effect */
.join:hover{
    transform:translateY(-4px);

    box-shadow:
        0 8px 0 #805300,
        0 18px 50px rgba(255,215,50,.85);
}

/* Click effect */
.join:active{
    transform:translateY(2px);

    box-shadow:
        0 3px 0 #805300,
        0 8px 20px rgba(255,193,7,.4);
}

/* Info box */
.info{
    margin-top:22px;
    padding:17px;

    border-radius:14px;

    border:1px solid rgba(255,225,100,.5);

    background:rgba(20,12,0,.58);

    backdrop-filter:blur(8px);

    color:#ffefb0;

    font-size:14px;
    line-height:2;

    box-shadow:
        0 10px 30px rgba(0,0,0,.3),
        inset 0 0 20px rgba(255,193,7,.05);
}

/* Footer */
.footer{
    margin-top:24px;

    color:#d9bb60;

    font-size:12px;
    line-height:1.7;
}

.telegram{
    font-size:22px;
}

/* Mobile */
@media(max-width:480px){

    .card{
        padding:25px 12px;
    }

    .dp{
        width:105px;
        height:105px;
    }

    h1{
        font-size:27px;
    }

    .join{
        padding:17px;
    }
}
</style>
